services:
  - type: web
    name: ag-store-ecommerce-backend
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/AminLakhani14/Ecommerce-Backend
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
